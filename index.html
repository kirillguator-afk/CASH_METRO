<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>METRO CASH - Дурак Онлайн</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-950 text-white font-['Inter'] overflow-hidden">
    <!-- Overlay для Лобби -->
    <div id="lobby-overlay" class="fixed inset-0 z-50 bg-slate-900 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-3xl p-8 shadow-2xl">
            <div class="text-center mb-8">
                <h1 class="text-4xl font-extrabold text-yellow-500 mb-2 tracking-tighter">METRO <span class="text-white">CASH</span></h1>
                <p class="text-slate-400">Элитный клуб любителей Дурака</p>
            </div>
            
            <div id="user-profile" class="mb-6 p-4 bg-slate-900/50 rounded-xl border border-slate-700 flex justify-between items-center">
                <div>
                    <p class="text-xs text-slate-500 uppercase tracking-widest">Ваш баланс</p>
                    <p class="text-2xl font-bold text-green-400" id="user-balance">1,000 ₽</p>
                </div>
                <div class="text-right">
                    <p class="text-xs text-slate-500 uppercase tracking-widest">ID игрока</p>
                    <p class="text-sm font-mono text-blue-400" id="my-peer-id">...</p>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1 uppercase">Ставка (₽)</label>
                    <select id="bet-amount" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-yellow-500 outline-none">
                        <option value="50">50 ₽</option>
                        <option value="100">100 ₽</option>
                        <option value="500">500 ₽</option>
                        <option value="1000">1,000 ₽</option>
                    </select>
                </div>
                
                <button id="create-game" class="w-full py-4 bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold rounded-xl transition-all transform active:scale-95 shadow-lg shadow-yellow-500/20">
                    СОЗДАТЬ СТОЛ
                </button>
                
                <div class="relative">
                    <div class="absolute inset-0 flex items-center"><span class="w-full border-t border-slate-700"></span></div>
                    <div class="relative flex justify-center text-xs uppercase"><span class="bg-slate-800 px-2 text-slate-500">или присоединиться</span></div>
                </div>

                <div class="flex gap-2">
                    <input id="join-room-id" type="text" placeholder="ID комнаты" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 outline-none focus:border-blue-500">
                    <button id="join-game" class="px-6 bg-blue-600 hover:bg-blue-700 font-bold rounded-lg transition-colors">ВХОД</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Игровой интерфейс -->
    <main id="game-ui" class="hidden h-screen flex flex-col relative overflow-hidden bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-emerald-900 via-slate-950 to-slate-950">
        <!-- Верхняя панель: Оппонент -->
        <div class="h-1/4 flex flex-col items-center justify-start pt-8">
            <div id="opponent-info" class="mb-4 text-center">
                <div class="w-16 h-16 rounded-full bg-slate-800 border-2 border-slate-700 mx-auto flex items-center justify-center mb-1">
                    <span class="text-2xl">👤</span>
                </div>
                <p id="opponent-name" class="text-sm font-bold text-slate-300">Ожидание игрока...</p>
                <p id="opponent-cards-count" class="text-xs text-blue-400">Карт: 0</p>
            </div>
            <div id="opponent-hand" class="flex justify-center -space-x-8 h-20 pointer-events-none opacity-50">
                <!-- Карты противника (рубашкой вверх) -->
            </div>
        </div>

        <!-- Центр: Игровой стол -->
        <div class="flex-1 relative flex items-center justify-center">
            <!-- Колода -->
            <div id="deck-area" class="absolute left-8 flex items-center">
                <div class="relative w-16 h-24 bg-slate-800 rounded-lg border border-slate-700 shadow-xl deck-stack"></div>
                <div id="trump-card" class="ml-4 transform rotate-90 card-mini"></div>
                <div id="cards-left" class="absolute -top-6 left-0 text-xs font-bold text-slate-500">36</div>
            </div>

            <!-- Игровое поле (бито/ход) -->
            <div id="table-surface" class="w-[600px] h-[300px] bg-black/20 rounded-[100px] border border-white/5 flex flex-wrap items-center justify-center gap-4 p-8">
                <!-- Сюда падают карты -->
            </div>

            <!-- Уведомления игры -->
            <div id="game-status" class="absolute top-0 px-6 py-2 bg-yellow-500 text-slate-950 rounded-full font-bold text-sm shadow-xl hidden animate-bounce">
                ВАШ ХОД
            </div>
        </div>

        <!-- Нижняя панель: Игрок -->
        <div class="h-1/3 flex flex-col items-center justify-end pb-12">
            <div class="mb-4 flex gap-4">
                <button id="take-cards" class="hidden px-8 py-2 bg-red-600 hover:bg-red-700 rounded-full font-bold text-sm shadow-lg shadow-red-600/20 transition-all">ВЗЯТЬ</button>
                <button id="pass-turn" class="hidden px-8 py-2 bg-blue-600 hover:bg-blue-700 rounded-full font-bold text-sm shadow-lg shadow-blue-600/20 transition-all">БИТО</button>
            </div>
            <div id="player-hand" class="flex justify-center -space-x-10 h-32 w-full max-w-4xl px-12 transition-all">
                <!-- Карты игрока -->
            </div>
        </div>

        <!-- Инфо о ставке -->
        <div class="absolute bottom-4 left-4 bg-slate-900/80 border border-slate-700 p-3 rounded-xl">
            <p class="text-[10px] text-slate-500 uppercase">Банк игры</p>
            <p id="game-pot" class="text-xl font-black text-yellow-500">0 ₽</p>
        </div>
    </main>

    <div id="game-over-modal" class="fixed inset-0 z-[60] bg-black/90 hidden items-center justify-center p-4">
        <div class="text-center">
            <h2 id="win-status" class="text-6xl font-black text-yellow-500 mb-4">ПОБЕДА!</h2>
            <p id="win-amount" class="text-2xl text-white mb-8">+200 ₽</p>
            <button onclick="location.reload()" class="px-12 py-4 bg-white text-black font-bold rounded-full hover:bg-slate-200 transition-colors">В ЛОББИ</button>
        </div>
    </div>

    <script src="cards.js"></script>
    <script src="state.js"></script>
    <script src="network.js"></script>
    <script src="game.js"></script>
    <script src="ui.js"></script>
</body>
</html>
