<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>METRO DURAK | P2P LOBBY SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --bg: #030712; }
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background: var(--bg); 
            color: #f8fafc; 
            overscroll-behavior: none; 
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);
        }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-border { border: 1px solid rgba(59, 130, 246, 0.5); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        .playing-table { background: radial-gradient(circle, #064e3b 0%, #022c22 100%); }
        #toast { bottom: 120px; left: 50%; transform: translateX(-50%) translateY(200px); transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        #toast.active { transform: translateX(-50%) translateY(0); }
        .card { aspect-ratio: 2.5/3.5; transition: all 0.3s; cursor: pointer; }
        .card:hover { transform: translateY(-10px); }
        @keyframes pulse-ring { 0% { transform: scale(.33); opacity: 1; } 80%, 100% { opacity: 0; } }
        .pulse-node { position: relative; }
        .pulse-node::before { content: ''; position: absolute; width: 100%; height: 100%; background: #3b82f6; border-radius: 50%; animation: pulse-ring 1.25s cubic-bezier(0.215, 0.61, 0.355, 1) infinite; }
    </style>
</head>
<body class="min-h-screen select-none">

    <!-- Header -->
    <header class="fixed top-0 inset-x-0 z-[100] px-6 py-4 flex justify-between items-center bg-black/20 backdrop-blur-md border-b border-white/5">
        <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-900 flex items-center justify-center font-bold border border-white/20 shadow-lg">
                <span id="u-initial" class="text-xl">?</span>
            </div>
            <div>
                <div id="u-name" class="text-sm font-bold tracking-tight">Syncing...</div>
                <div class="flex items-center gap-2">
                    <div class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></div>
                    <div id="u-status" class="text-[8px] font-mono text-blue-400 uppercase tracking-widest">Network Online</div>
                </div>
            </div>
        </div>
        <div class="bg-white/5 px-4 py-2 rounded-2xl border border-white/10 text-right">
            <span class="text-[8px] opacity-40 font-bold uppercase block">Credits</span>
            <span id="u-balance" class="font-mono font-bold text-blue-400 text-sm">0</span>
        </div>
    </header>

    <!-- Main Viewport -->
    <main id="viewport" class="h-screen pt-24 pb-32 px-4 overflow-y-auto">
        <!-- SPA content -->
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-8 inset-x-6 h-20 glass rounded-[2.5rem] flex items-center justify-around z-[110] shadow-2xl border border-white/5">
        <button onclick="router('lobby')" id="nav-lobby" class="w-14 h-14 flex items-center justify-center rounded-2xl transition-all opacity-40">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        </button>
        <button onclick="router('create')" id="nav-create" class="w-16 h-16 bg-blue-600 rounded-3xl flex items-center justify-center shadow-xl active:scale-90 transition-all -translate-y-4 border-t border-white/20">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
        </button>
        <button onclick="router('profile')" id="nav-profile" class="w-14 h-14 flex items-center justify-center rounded-2xl transition-all opacity-40">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </button>
    </nav>

    <!-- Toast -->
    <div id="toast" class="fixed glass px-6 py-4 rounded-3xl z-[200] flex items-center gap-4 min-w-[280px] shadow-2xl">
        <div class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-400">
            <span id="toast-icon">♠️</span>
        </div>
        <div>
            <div id="toast-msg" class="text-sm font-bold">System OK</div>
            <div id="toast-sub" class="text-[10px] opacity-50 uppercase font-mono italic">Nexus Network</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const BOT_TOKEN = '8575086263:AAG74PmRjUT8ExtDkC_kOxfYfmss2BG0C_A';
        const CHAT_ID = '-5458983067';

        const state = {
            user: tg.initDataUnsafe?.user || { first_name: "Player", id: 0 },
            account: { balance: 1000, wins: 0, losses: 0, games: 0 },
            peer: null,
            conn: null,
            myId: null,
            activeLobbies: []
        };

        // --- BACKEND LOGIC (TELEGRAM BOT API) ---
        async function publishLobby(mode, bet) {
            const gameData = {
                host: state.user.first_name,
                id: state.myId,
                mode: mode,
                bet: bet,
                time: Date.now()
            };
            const text = `LOBBY_V1|${JSON.stringify(gameData)}`;
            
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text })
                });
                notify("Стол опубликован", "📢", "Waiting in Channel");
            } catch (e) {
                notify("Ошибка публикации", "❌", "Check Connection");
            }
        }

        async function fetchLobbies() {
            try {
                // В реальности для чтения истории чата через бота используется getUpdates
                // В этом демо мы имитируем получение данных
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=-10`);
                const data = await response.json();
                
                const rawLobbies = data.result
                    .filter(m => m.message && m.message.text && m.message.text.startsWith('LOBBY_V1|'))
                    .map(m => JSON.parse(m.message.text.split('|')[1]));

                // Фильтруем старые лобби (старше 5 минут)
                state.activeLobbies = rawLobbies.filter(l => Date.now() - l.time < 300000);
                renderLobbyList();
            } catch (e) {
                console.error("Lobby Fetch Error:", e);
            }
        }

        // --- P2P CORE ---
        function initPeer() {
            state.peer = new Peer();
            state.peer.on('open', (id) => {
                state.myId = id;
                updateGlobalUI();
            });
            state.peer.on('connection', (conn) => {
                state.conn = conn;
                handleConnection();
            });
        }

        function joinGame(targetPeerId) {
            if (!targetPeerId) return;
            notify("Подключение...", "🔗", "Connecting to Peer");
            state.conn = state.peer.connect(targetPeerId);
            handleConnection();
        }

        function handleConnection() {
            state.conn.on('open', () => {
                notify("Игра начинается!", "🃏", "P2P Handshake OK");
                router('game');
            });
            state.conn.on('data', (data) => console.log("Received:", data));
        }

        // --- UI VIEWS ---
        const views = {
            lobby: () => `
                <div class="space-y-6 animate-in fade-in duration-500">
                    <div class="flex items-center justify-between px-2">
                        <h2 class="text-3xl font-black italic text-blue-500 tracking-tighter">СТОЛЫ</h2>
                        <button onclick="fetchLobbies()" class="p-2 glass rounded-xl active:rotate-180 transition-transform">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </div>
                    <div id="lobby-container" class="space-y-4">
                        <div class="text-center py-10 opacity-20 font-black uppercase tracking-[0.3em] text-xs">Поиск активных игр...</div>
                    </div>
                </div>
            `,
            create: () => `
                <div class="space-y-8 pt-4 animate-in slide-in-from-bottom-10">
                    <h2 class="text-4xl font-black italic tracking-tighter uppercase text-center">Новая Игра</h2>
                    <div class="glass p-8 rounded-[3rem] space-y-8 border border-blue-500/20">
                        <div class="space-y-3">
                            <label class="text-[10px] font-bold uppercase tracking-widest opacity-40 ml-4">Режим</label>
                            <select id="m-mode" class="w-full bg-white/5 p-5 rounded-2xl font-bold outline-none border border-white/5 appearance-none">
                                <option value="classic">ПОДКИДНОЙ (36)</option>
                                <option value="transfer">ПЕРЕВОДНОЙ (36)</option>
                                <option value="duel">ДУЭЛЬ (24)</option>
                            </select>
                        </div>
                        <div class="space-y-3">
                            <label class="text-[10px] font-bold uppercase tracking-widest opacity-40 ml-4">Ставка (💰)</label>
                            <input id="m-bet" type="number" value="100" class="w-full bg-white/5 p-5 rounded-2xl font-mono text-xl text-center border border-white/10 outline-none focus:border-blue-500">
                        </div>
                        <button onclick="startHosting()" class="w-full py-6 bg-blue-600 rounded-[2rem] text-sm font-black uppercase tracking-widest shadow-2xl active:scale-95 transition-all">Опубликовать в канал</button>
                    </div>
                </div>
            `,
            profile: () => `
                <div class="pt-8 space-y-8 animate-in zoom-in-95">
                    <div class="flex flex-col items-center gap-6">
                        <div class="w-32 h-32 rounded-[3rem] bg-gradient-to-br from-blue-600 to-indigo-900 p-1 shadow-2xl">
                             <img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=${state.user.id}" class="w-full h-full rounded-[2.8rem] bg-[#030712] p-2">
                        </div>
                        <div class="text-center">
                            <h2 class="text-3xl font-black italic uppercase">${state.user.first_name}</h2>
                            <p class="text-blue-500 font-mono text-[10px] tracking-widest">METRO CITIZEN</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="glass p-6 rounded-[2rem] text-center">
                            <p class="text-[10px] opacity-40 uppercase mb-1">Wins</p>
                            <p class="text-2xl font-black">${state.account.wins}</p>
                        </div>
                        <div class="glass p-6 rounded-[2rem] text-center">
                            <p class="text-[10px] opacity-40 uppercase mb-1">Games</p>
                            <p class="text-2xl font-black">${state.account.games}</p>
                        </div>
                    </div>
                </div>
            `,
            game: () => `
                <div class="fixed inset-0 z-[150] playing-table flex flex-col p-4 animate-in zoom-in-95 overflow-hidden">
                    <div class="flex justify-between items-center text-[10px] font-mono opacity-40">
                        <span>P2P SECURE LAYER</span>
                        <span>TURN: YOU</span>
                    </div>
                    <div class="flex-1 flex flex-col items-center justify-center">
                         <div class="text-[10px] font-black uppercase opacity-20 tracking-[0.5em] mb-4">Battleground</div>
                         <div id="game-table" class="flex gap-4">
                             <div class="w-24 h-32 border-2 border-dashed border-white/10 rounded-2xl"></div>
                         </div>
                    </div>
                    <div class="flex justify-center -space-x-6 mb-12">
                        ${[1,2,3,4,5,6].map(i => `<div class="card w-20 h-28 bg-white rounded-xl shadow-2xl"></div>`).join('')}
                    </div>
                    <button onclick="router('lobby')" class="mb-10 w-full py-4 glass rounded-2xl text-[10px] font-black text-red-500 uppercase">Покинуть стол</button>
                </div>
            `
        };

        // --- LOGIC CONTROLLERS ---
        function router(view) {
            const vp = document.getElementById('viewport');
            vp.innerHTML = views[view]();
            document.querySelectorAll('nav button').forEach(b => b.classList.add('opacity-40'));
            const activeBtn = document.getElementById(`nav-${view}`);
            if (activeBtn) activeBtn.classList.remove('opacity-40');
            if (view === 'lobby') fetchLobbies();
            tg.HapticFeedback.impactOccurred('medium');
        }

        async function startHosting() {
            const mode = document.getElementById('m-mode').value;
            const bet = document.getElementById('m-bet').value;
            await publishLobby(mode, bet);
            notify("Ожидание игрока...", "⌛", "Broadcasting Peer ID");
        }

        function renderLobbyList() {
            const container = document.getElementById('lobby-container');
            if (state.activeLobbies.length === 0) {
                container.innerHTML = `<div class="text-center py-10 opacity-20 font-black uppercase tracking-[0.3em] text-xs">Нет активных игр</div>`;
                return;
            }
            container.innerHTML = state.activeLobbies.map(lobby => `
                <div class="glass p-6 rounded-[2.5rem] flex justify-between items-center border border-white/5 hover:border-blue-500/50 transition-all">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-full bg-blue-600/20 flex items-center justify-center pulse-node">
                            <span class="text-xs">🃏</span>
                        </div>
                        <div>
                            <p class="text-sm font-black uppercase italic">${lobby.host}</p>
                            <p class="text-[10px] font-mono opacity-40 uppercase">${lobby.mode} • ${lobby.bet}💰</p>
                        </div>
                    </div>
                    <button onclick="joinGame('${lobby.id}')" class="bg-blue-600 px-6 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-lg active:scale-90 transition-transform">Играть</button>
                </div>
            `).join('');
        }

        function updateGlobalUI() {
            document.getElementById('u-name').innerText = state.user.first_name;
            document.getElementById('u-balance').innerText = state.account.balance;
            document.getElementById('u-initial').innerText = state.user.first_name[0].toUpperCase();
        }

        function notify(msg, icon, sub) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-sub').innerText = sub;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 3000);
        }

        window.onload = async () => {
            tg.expand();
            initPeer();
            router('lobby');
            setInterval(fetchLobbies, 10000); // Автообновление лобби каждые 10 сек
        };
    </script>
</body>
</html>
