<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>METRO DURAK | P2P Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;900&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --bg: #070b14; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #f8fafc; overscroll-behavior: none; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .animated-bg { background: linear-gradient(270deg, #1e40af, #111827, #1e3a8a); background-size: 400% 400%; animation: moveGradient 15s infinite; }
        @keyframes moveGradient { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .card-shadow { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
        .nav-active { color: var(--accent); }
        #toast { bottom: 100px; left: 50%; transform: translateX(-50%) translateY(100px); transition: all 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28); }
        #toast.active { transform: translateX(-50%) translateY(0); opacity: 1; }
        .playing-table { background: radial-gradient(circle, #065f46 0%, #064e3b 100%); border: 8px solid #047857; }
    </style>
</head>
<body class="min-h-screen select-none">

    <!-- Header -->
    <header class="fixed top-0 inset-x-0 z-[100] px-4 py-3 glass border-b border-white/5 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl animated-bg flex items-center justify-center font-black border border-white/10 shadow-lg">M</div>
            <div>
                <div id="u-name" class="text-xs font-black uppercase tracking-tighter">Loading...</div>
                <div id="u-peer-id" class="text-[8px] font-mono text-white/30">Connecting to Peer...</div>
            </div>
        </div>
        <div class="flex items-center gap-2 bg-slate-900/80 px-4 py-2 rounded-2xl border border-white/10">
            <span class="text-xs text-blue-400">💰</span>
            <span id="u-balance" class="text-sm font-black tabular-nums">1,000</span>
        </div>
    </header>

    <!-- Content Viewport -->
    <main id="viewport" class="h-screen pt-20 pb-28 px-4 overflow-y-auto">
        <!-- SPA views will load here -->
    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-6 inset-x-4 h-16 glass rounded-3xl flex items-center justify-around z-[110] border border-white/5 shadow-2xl">
        <button onclick="router('lobby')" id="nav-lobby" class="flex flex-col items-center gap-1 opacity-40"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg></button>
        <button onclick="router('create')" id="nav-create" class="relative -top-4 w-14 h-14 animated-bg rounded-full flex items-center justify-center shadow-2xl border-4 border-[#070b14] active:scale-90 transition-transform"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg></button>
        <button onclick="router('profile')" id="nav-profile" class="flex flex-col items-center gap-1 opacity-40"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></button>
    </nav>

    <!-- Global Elements -->
    <div id="toast" class="fixed glass px-6 py-3 rounded-2xl z-[200] opacity-0 shadow-2xl flex items-center gap-3">
        <span id="toast-icon">♠️</span> <span id="toast-msg" class="text-sm font-bold"></span>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const BOT_TOKEN = '8575086263:AAG74PmRjUT8ExtDkC_kOxfYfmss2BG0C_A';
        const CHAT_ID = '-5458983067';

        const state = {
            user: tg.initDataUnsafe?.user || { first_name: "Local Player", id: 12345 },
            peer: null,
            myId: null,
            currentRoom: null,
            lobbies: []
        };

        // --- NETWORK LAYER (PEER JS) ---
        function initPeer() {
            state.peer = new Peer();
            state.peer.on('open', (id) => {
                state.myId = id;
                document.getElementById('u-peer-id').innerText = `ID: ${id}`;
                refreshLobbies();
            });
            state.peer.on('connection', (conn) => {
                handleConnection(conn);
            });
        }

        async function postLobbyToTG(roomName, mode) {
            const text = `LOBBY_DATA|${roomName}|${mode}|${state.myId}|${state.user.first_name}`;
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(text)}`);
        }

        async function refreshLobbies() {
            try {
                // В реальном приложении здесь нужен getUpdates или бэкенд. 
                // Имитируем получение данных через поиск сообщений бота.
                notify("Обновление лобби...", "🔄");
                // Эмуляция: так как чтение чатов через Bot API ограничено,
                // обычно используется webhook. Здесь мы показываем структуру.
            } catch (e) { console.error(e); }
        }

        // --- UI ROUTER ---
        const views = {
            lobby: () => `
                <div class="space-y-4 animate-in fade-in duration-300">
                    <div class="flex justify-between items-center px-2">
                        <h2 class="text-xl font-black italic uppercase tracking-tighter text-blue-500">Live Lobbies</h2>
                        <button onclick="refreshLobbies()" class="text-[10px] font-bold opacity-40">REFRESH</button>
                    </div>
                    <div id="lobby-list" class="space-y-3">
                        <div class="glass p-5 rounded-[2rem] flex justify-between items-center border-l-4 border-blue-500">
                            <div>
                                <p class="text-sm font-bold">VIP TABLE #1</p>
                                <p class="text-[10px] text-white/30 uppercase tracking-widest italic">Classic • 36 Cards</p>
                            </div>
                            <button onclick="joinGame('demo')" class="bg-blue-600 px-6 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg">Join</button>
                        </div>
                        <div class="glass p-5 rounded-[2rem] flex justify-between items-center border-l-4 border-purple-500">
                            <div>
                                <p class="text-sm font-bold">FAST DUEL</p>
                                <p class="text-[10px] text-white/30 uppercase tracking-widest italic">Transferable • 2 Players</p>
                            </div>
                            <button class="bg-purple-600 px-6 py-2 rounded-xl text-[10px] font-black uppercase shadow-lg">Join</button>
                        </div>
                    </div>
                </div>
            `,
            create: () => `
                <div class="space-y-6 pt-6 animate-in slide-in-from-bottom-5">
                    <h2 class="text-2xl font-black italic uppercase tracking-tighter text-center">Создать Игру</h2>
                    <div class="glass p-6 rounded-[2.5rem] space-y-4">
                        <div>
                            <label class="text-[10px] font-black text-white/40 uppercase px-2">Режим игры</label>
                            <select id="game-mode" class="w-full bg-slate-800 p-4 rounded-2xl mt-1 font-bold border border-white/5 outline-none">
                                <option value="classic">Подкидной (36 карт)</option>
                                <option value="transfer">Переводной (36 карт)</option>
                                <option value="duel">Дуэль (24 карты)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-black text-white/40 uppercase px-2">Ставка (💰)</label>
                            <input id="game-bet" type="number" value="100" class="w-full bg-slate-800 p-4 rounded-2xl mt-1 font-bold border border-white/5 outline-none">
                        </div>
                        <button onclick="createRoom()" class="w-full py-5 animated-bg rounded-3xl text-sm font-black uppercase shadow-2xl active:scale-95 transition-all">Опубликовать Стол</button>
                    </div>
                </div>
            `,
            game: () => `
                <div class="fixed inset-0 z-[150] playing-table flex flex-col p-4 animate-in zoom-in-95 duration-300">
                    <!-- Opponent Hand -->
                    <div class="flex justify-center gap-1 opacity-60">
                        ${Array(6).fill('<div class="w-8 h-12 bg-blue-900 border border-white/20 rounded-md card-shadow"></div>').join('')}
                    </div>
                    
                    <!-- Table Center -->
                    <div class="flex-1 flex flex-col items-center justify-center relative">
                        <div class="absolute top-4 right-0 glass px-3 py-1 rounded-full text-[10px] font-bold">Козырь: ♥️</div>
                        <div id="game-desk" class="grid grid-cols-3 gap-4">
                             <!-- Cards will be here -->
                        </div>
                        <div class="mt-8 text-center">
                            <p class="text-[10px] font-black uppercase tracking-widest text-white/30">Ваш ход</p>
                            <div class="text-2xl font-black italic italic">АТАКА</div>
                        </div>
                    </div>

                    <!-- Player Hand -->
                    <div class="flex justify-center gap-2 overflow-x-auto pb-4">
                        <div class="w-16 h-24 bg-white rounded-lg card-shadow flex flex-col p-1 text-red-600 font-bold active:translate-y-[-10px] transition-transform">
                            <span>A</span><span class="text-2xl">♥️</span>
                        </div>
                        <div class="w-16 h-24 bg-white rounded-lg card-shadow flex flex-col p-1 text-black font-bold active:translate-y-[-10px] transition-transform">
                            <span>10</span><span class="text-2xl">♠️</span>
                        </div>
                        <div class="w-16 h-24 bg-white rounded-lg card-shadow flex flex-col p-1 text-red-600 font-bold active:translate-y-[-10px] transition-transform">
                            <span>K</span><span class="text-2xl">♦️</span>
                        </div>
                    </div>

                    <div class="flex gap-2 mb-4">
                        <button onclick="router('lobby')" class="flex-1 py-3 glass rounded-xl text-[10px] font-black uppercase border-red-500/50 text-red-500">Сдаться</button>
                        <button class="flex-1 py-3 bg-emerald-600 rounded-xl text-[10px] font-black uppercase shadow-lg">Бито / Беру</button>
                    </div>
                </div>
            `,
            profile: () => `
                <div class="flex flex-col items-center space-y-6 pt-10">
                    <div class="w-32 h-32 rounded-[2rem] glass p-2 rotate-3 border-blue-500">
                        <img src="https://api.dicebear.com/7.x/bottts/svg?seed=${state.user.id}" class="w-full h-full rounded-2xl">
                    </div>
                    <div class="text-center">
                        <h2 class="text-3xl font-black italic uppercase">${state.user.first_name}</h2>
                        <p class="text-blue-500 font-bold">PROFESSIONAL PLAYER</p>
                    </div>
                    <div class="w-full glass p-6 rounded-3xl space-y-4">
                        <div class="flex justify-between border-b border-white/5 pb-2"><span>Побед:</span><span class="font-bold text-emerald-400">128</span></div>
                        <div class="flex justify-between border-b border-white/5 pb-2"><span>Поражений:</span><span class="font-bold text-red-400">42</span></div>
                        <div class="flex justify-between"><span>Win Rate:</span><span class="font-bold italic">78%</span></div>
                    </div>
                </div>
            `
        };

        // --- CONTROLLERS ---
        function router(view) {
            const vp = document.getElementById('viewport');
            vp.innerHTML = views[view]();
            
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active', 'opacity-100'));
            const activeBtn = document.getElementById(`nav-${view}`);
            if (activeBtn) {
                activeBtn.classList.add('nav-active', 'opacity-100');
            }
            tg.HapticFeedback.selectionChanged();
        }

        async function createRoom() {
            const mode = document.getElementById('game-mode').value;
            const bet = document.getElementById('game-bet').value;
            
            notify("Публикация лобби...", "📢");
            await postLobbyToTG(`${state.user.first_name}'s Table`, mode);
            
            state.currentRoom = { mode, bet, role: 'host' };
            router('game');
            notify("Ожидание оппонента...", "⌛");
        }

        function joinGame(id) {
            notify("Подключение к Peer...", "🔗");
            // Логика PeerJS соединения
            setTimeout(() => {
                router('game');
                notify("Игра началась!", "🃏");
            }, 1000);
        }

        function notify(msg, icon = '♠️') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 3000);
        }

        // --- INIT ---
        window.onload = () => {
            document.getElementById('u-name').innerText = state.user.first_name;
            initPeer();
            router('lobby');
            tg.expand();
        };
    </script>
</body>
</html>
