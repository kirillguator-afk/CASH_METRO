<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>METRO DURAK | P2P LOBBY SYSTEM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --bg: #030712; }
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background: var(--bg); 
            color: #f8fafc; 
            overscroll-behavior: none; 
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);
        }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .playing-table { background: radial-gradient(circle, #064e3b 0%, #022c22 100%); }
        #toast { bottom: 120px; left: 50%; transform: translateX(-50%) translateY(200px); transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        #toast.active { transform: translateX(-50%) translateY(0); }
        .loader-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .pulse-node { position: relative; }
        .pulse-node::before { content: ''; position: absolute; width: 100%; height: 100%; background: #3b82f6; border-radius: 50%; animation: pulse-ring 1.5s infinite; opacity: 0.5; }
        @keyframes pulse-ring { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
    </style>
</head>
<body class="min-h-screen select-none">

    <!-- Header -->
    <header class="fixed top-0 inset-x-0 z-[100] px-6 py-4 flex justify-between items-center bg-black/40 backdrop-blur-md border-b border-white/5">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-900 flex items-center justify-center font-bold border border-white/10 shadow-lg">
                <span id="u-initial">?</span>
            </div>
            <div>
                <div id="u-name" class="text-xs font-bold tracking-tight uppercase">Loading...</div>
                <div class="flex items-center gap-1.5">
                    <div id="net-indicator" class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></div>
                    <div id="u-status" class="text-[8px] font-mono text-blue-400 uppercase tracking-widest italic">P2P Offline</div>
                </div>
            </div>
        </div>
        <div class="bg-white/5 px-4 py-2 rounded-2xl border border-white/10 text-right">
            <span class="text-[7px] opacity-40 font-black uppercase block tracking-widest">Balance</span>
            <span id="u-balance" class="font-mono font-bold text-blue-400 text-sm">0</span>
        </div>
    </header>

    <!-- Content -->
    <main id="viewport" class="h-screen pt-24 pb-32 px-4 overflow-y-auto">
        <!-- Views -->
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-8 inset-x-6 h-20 glass rounded-[2.5rem] flex items-center justify-around z-[110] shadow-2xl border border-white/5">
        <button onclick="router('lobby')" id="nav-lobby" class="w-14 h-14 flex items-center justify-center rounded-2xl transition-all opacity-40">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        </button>
        <button onclick="router('create')" id="nav-create" class="w-16 h-16 bg-blue-600 rounded-3xl flex items-center justify-center shadow-xl active:scale-90 transition-all -translate-y-4 border-t border-white/20">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
        </button>
        <button onclick="router('profile')" id="nav-profile" class="w-14 h-14 flex items-center justify-center rounded-2xl transition-all opacity-40">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </button>
    </nav>

    <!-- Toast -->
    <div id="toast" class="fixed glass px-6 py-4 rounded-3xl z-[200] flex items-center gap-4 min-w-[280px] shadow-2xl">
        <div id="toast-icon-box" class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-400">
            <span id="toast-icon">♠️</span>
        </div>
        <div>
            <div id="toast-msg" class="text-sm font-bold tracking-tight italic">Status Ready</div>
            <div id="toast-sub" class="text-[9px] opacity-40 uppercase font-mono tracking-widest">Nexus DB Node</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const BOT_TOKEN = '8575086263:AAG74PmRjUT8ExtDkC_kOxfYfmss2BG0C_A';
        const CHAT_ID = '-5458983067';

        const state = {
            user: tg.initDataUnsafe?.user || { first_name: "Local Dev", id: 0 },
            account: { balance: 2500, wins: 0, games: 0 },
            peer: null,
            myId: null,
            conn: null,
            activeLobbies: [],
            isFetching: false
        };

        // --- FETCHING ENGINE ---
        async function fetchLobbies() {
            if (state.isFetching) return;
            state.isFetching = true;

            const container = document.getElementById('lobby-container');
            if (container && state.activeLobbies.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center py-12 gap-4">
                    <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full loader-spin"></div>
                    <p class="text-[10px] font-mono opacity-40 animate-pulse uppercase">Scanning Telegram Database...</p>
                </div>`;
            }

            try {
                // Пытаемся получить последние 100 обновлений. 
                // Мы НЕ используем offset, чтобы сообщения не "пропадали" для других пользователей.
                const url = `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?limit=100&allowed_updates=["message","channel_post"]`;
                const res = await fetch(url);
                const data = await res.json();

                if (data.ok && data.result) {
                    const now = Date.now();
                    const found = data.result
                        .map(update => {
                            const msg = update.message || update.channel_post;
                            if (msg && msg.text && msg.text.startsWith('LOBBY_V1|')) {
                                try {
                                    return JSON.parse(msg.text.split('|')[1]);
                                } catch(e) { return null; }
                            }
                            return null;
                        })
                        .filter(l => l && (now - l.ts < 1800000)); // Живут 30 минут

                    // Фильтруем уникальные по Peer ID и берем самые свежие
                    const unique = Array.from(new Map(found.map(item => [item.id, item])).values()).reverse();
                    state.activeLobbies = unique;
                    
                    if (window.currentView === 'lobby') renderLobbyList();
                }
            } catch (e) {
                console.error("Lobby Sync Error:", e);
            } finally {
                state.isFetching = false;
            }
        }

        async function publishLobby(mode, bet) {
            if (!state.myId) return notify("Peer Not Ready", "⚠️", "Establishing connection...");

            const lobbyData = {
                host: state.user.first_name,
                id: state.myId,
                mode: mode.toUpperCase(),
                bet: bet,
                ts: Date.now()
            };

            const text = `LOBBY_V1|${JSON.stringify(lobbyData)}`;

            try {
                notify("Публикация...", "📡", "Sending to Channel");
                const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text })
                });
                
                if (res.ok) {
                    notify("Стол активен", "✅", "Waiting for opponent");
                    router('game');
                } else {
                    const err = await res.json();
                    notify("Ошибка бота", "❌", err.description);
                }
            } catch (e) {
                notify("Ошибка сети", "❌", "Check Internet");
            }
        }

        // --- PEER JS ---
        function initPeer() {
            state.peer = new Peer();
            state.peer.on('open', id => {
                state.myId = id;
                document.getElementById('net-indicator').className = "w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse";
                document.getElementById('u-status').innerText = `P2P Online: ${id.slice(0,6)}`;
                updateHeader();
                fetchLobbies();
            });
            state.peer.on('connection', conn => {
                state.conn = conn;
                notify("Игрок вошел!", "🤝", "Starting Match");
                router('game');
            });
        }

        function joinGame(targetId) {
            if (targetId === state.myId) return notify("Ваш стол", "🚫", "Cannot join self");
            notify("Подключение...", "🔗", "Establishing Link");
            state.conn = state.peer.connect(targetId);
            state.conn.on('open', () => router('game'));
        }

        // --- UI ---
        const views = {
            lobby: () => `
                <div class="space-y-6 animate-in fade-in duration-500">
                    <div class="flex items-center justify-between px-2">
                        <h2 class="text-3xl font-black italic text-blue-500 tracking-tighter">СТОЛЫ</h2>
                        <button onclick="fetchLobbies()" class="w-10 h-10 glass rounded-xl flex items-center justify-center active:rotate-180 transition-transform">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        </button>
                    </div>
                    <div id="lobby-container" class="grid gap-4 pb-10">
                        <!-- Lobbies -->
                    </div>
                </div>
            `,
            create: () => `
                <div class="space-y-8 pt-4 animate-in slide-in-from-bottom-10">
                    <h2 class="text-4xl font-black italic tracking-tighter uppercase text-center">Создать</h2>
                    <div class="glass p-8 rounded-[3rem] space-y-8 border border-white/5">
                        <div class="space-y-3">
                            <label class="text-[10px] font-bold uppercase tracking-widest opacity-40 ml-4">Режим</label>
                            <select id="m-mode" class="w-full bg-white/5 p-5 rounded-2xl font-bold border border-white/10 outline-none appearance-none">
                                <option value="classic">ПОДКИДНОЙ (36)</option>
                                <option value="duel">ДУЭЛЬ (24)</option>
                                <option value="transfer">ПЕРЕВОДНОЙ (36)</option>
                            </select>
                        </div>
                        <div class="space-y-3">
                            <label class="text-[10px] font-bold uppercase tracking-widest opacity-40 ml-4">Ставка (💰)</label>
                            <input id="m-bet" type="number" value="100" class="w-full bg-white/5 p-5 rounded-2xl font-mono text-2xl text-center border border-white/10 outline-none">
                        </div>
                        <button onclick="publishLobby(document.getElementById('m-mode').value, document.getElementById('m-bet').value)" class="w-full py-6 bg-blue-600 rounded-[2rem] text-sm font-black uppercase tracking-widest shadow-2xl active:scale-95 transition-all">Опубликовать</button>
                    </div>
                </div>
            `,
            profile: () => `
                <div class="pt-8 space-y-8 animate-in zoom-in-95">
                    <div class="flex flex-col items-center gap-6">
                        <div class="w-32 h-32 rounded-[2.5rem] bg-gradient-to-br from-blue-600 to-indigo-900 p-1 shadow-2xl">
                             <img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=${state.user.id}" class="w-full h-full rounded-[2.3rem] bg-[#030712] p-2">
                        </div>
                        <div class="text-center">
                            <h2 class="text-3xl font-black italic uppercase">${state.user.first_name}</h2>
                            <p class="text-blue-500 font-mono text-[9px] tracking-widest uppercase">Rank: Metro Nomad</p>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="glass p-6 rounded-[2rem] text-center border-b-2 border-emerald-500">
                            <p class="text-[9px] opacity-40 uppercase font-black">Wins</p>
                            <p class="text-2xl font-black">${state.account.wins}</p>
                        </div>
                        <div class="glass p-6 rounded-[2rem] text-center border-b-2 border-blue-500">
                            <p class="text-[9px] opacity-40 uppercase font-black">Games</p>
                            <p class="text-2xl font-black">${state.account.games}</p>
                        </div>
                    </div>
                </div>
            `,
            game: () => `
                <div class="fixed inset-0 z-[150] playing-table flex flex-col p-4 animate-in zoom-in-95">
                    <div class="flex justify-between items-center text-[10px] font-mono opacity-30 uppercase pt-2">
                        <span>P2P Encrypted Session</span>
                        <span class="animate-pulse">Handshaking...</span>
                    </div>
                    <div class="flex-1 flex flex-col items-center justify-center">
                         <div class="w-32 h-32 border-2 border-dashed border-white/5 rounded-[2.5rem] flex items-center justify-center bg-white/5">
                             <div class="text-center opacity-30">
                                 <p class="text-xl">⌛</p>
                                 <p class="text-[8px] font-black uppercase mt-1">Waiting</p>
                             </div>
                         </div>
                    </div>
                    <div class="flex justify-center -space-x-6 mb-16">
                         ${[1,2,3,4,5,6].map(() => `<div class="w-20 h-28 bg-white/10 border border-white/10 rounded-xl"></div>`).join('')}
                    </div>
                    <button onclick="router('lobby')" class="mb-10 py-5 glass rounded-3xl text-[10px] font-black text-red-500 uppercase tracking-widest active:bg-red-500/10 transition-colors">Сдаться / Выйти</button>
                </div>
            `
        };

        function renderLobbyList() {
            const container = document.getElementById('lobby-container');
            if (!container) return;

            if (state.activeLobbies.length === 0) {
                container.innerHTML = `<div class="text-center py-20">
                    <p class="text-xs font-black uppercase tracking-[0.2em] opacity-20 italic">Нет активных столов</p>
                    <p class="text-[8px] font-mono opacity-10 mt-2">Bot API scan: 0 results</p>
                </div>`;
                return;
            }

            container.innerHTML = state.activeLobbies.map(lobby => `
                <div class="glass p-5 rounded-[2.5rem] flex justify-between items-center border border-white/5 hover:border-blue-500/30 transition-all shadow-xl group">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl bg-blue-600/10 flex items-center justify-center pulse-node text-xl group-hover:scale-110 transition-transform">
                            🃏
                        </div>
                        <div>
                            <p class="text-sm font-black italic tracking-tight uppercase">${lobby.host}</p>
                            <div class="flex gap-2 mt-0.5">
                                <span class="text-[9px] font-mono text-blue-400 uppercase tracking-tighter bg-blue-400/10 px-1.5 rounded">${lobby.mode}</span>
                                <span class="text-[9px] font-mono text-emerald-400 font-bold">${lobby.bet}💰</span>
                            </div>
                        </div>
                    </div>
                    <button onclick="joinGame('${lobby.id}')" class="bg-blue-600 px-6 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-xl active:scale-95 transition-all">Вход</button>
                </div>
            `).join('');
        }

        function router(view) {
            window.currentView = view;
            const vp = document.getElementById('viewport');
            vp.innerHTML = views[view]();
            
            document.querySelectorAll('nav button').forEach(b => b.classList.add('opacity-40'));
            const activeBtn = document.getElementById(`nav-${view}`);
            if (activeBtn) activeBtn.classList.remove('opacity-40');
            
            if (view === 'lobby') fetchLobbies();
            tg.HapticFeedback.impactOccurred('light');
        }

        function updateHeader() {
            document.getElementById('u-name').innerText = state.user.first_name;
            document.getElementById('u-balance').innerText = state.account.balance.toLocaleString();
            document.getElementById('u-initial').innerText = state.user.first_name[0].toUpperCase();
        }

        function notify(msg, icon, sub) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-sub').innerText = sub;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 3000);
        }

        window.onload = () => {
            tg.expand();
            initPeer();
            router('lobby');
            // Регулярное обновление лобби
            setInterval(() => {
                if (window.currentView === 'lobby') fetchLobbies();
            }, 8000);
        };
    </script>
</body>
</html>
