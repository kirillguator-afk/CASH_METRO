<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>METRO DURAK | CLOUD SYNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #3b82f6; --bg: #030712; }
        body { 
            font-family: 'Space Grotesk', sans-serif; 
            background: var(--bg); 
            color: #f8fafc; 
            overscroll-behavior: none; 
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #111827 0%, #030712 100%);
        }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-border { border: 1px solid rgba(59, 130, 246, 0.5); box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
        
        .card { 
            aspect-ratio: 2.5/3.5; 
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            position: relative;
        }
        .card:hover { transform: translateY(-20px) rotate(2deg); z-index: 50; }
        .card-red { color: #ef4444; }
        .card-black { color: #ffffff; }

        .playing-table { 
            background: radial-gradient(circle, #064e3b 0%, #022c22 100%); 
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
        }

        #toast { bottom: 120px; left: 50%; transform: translateX(-50%) translateY(200px); transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        #toast.active { transform: translateX(-50%) translateY(0); }

        .shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    </style>
</head>
<body class="min-h-screen select-none">

    <!-- Global Header -->
    <header class="fixed top-0 inset-x-0 z-[100] px-6 py-4 flex justify-between items-center bg-black/20 backdrop-blur-md border-b border-white/5">
        <div class="flex items-center gap-3">
            <div class="relative group">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-900 flex items-center justify-center font-bold border border-white/20 shadow-lg overflow-hidden transition-transform group-active:scale-90">
                    <img id="u-avatar" src="" class="w-full h-full object-cover hidden">
                    <span id="u-initial" class="text-xl">?</span>
                </div>
                <div id="u-online-indicator" class="absolute -bottom-1 -right-1 w-4 h-4 bg-slate-500 border-2 border-[#030712] rounded-full transition-colors"></div>
            </div>
            <div>
                <div id="u-name" class="text-sm font-bold tracking-tight">Syncing...</div>
                <div id="u-status" class="text-[10px] font-mono text-blue-400/80 uppercase tracking-tighter">Initialising Cloud...</div>
            </div>
        </div>
        <div class="bg-white/5 px-4 py-2 rounded-2xl border border-white/10 flex flex-col items-end">
            <span class="text-[8px] opacity-40 font-bold uppercase tracking-widest">Balance</span>
            <div class="flex items-center gap-1">
                <span class="text-blue-400 text-xs">💰</span>
                <span id="u-balance" class="font-mono font-bold text-white text-sm">0</span>
            </div>
        </div>
    </header>

    <!-- Content -->
    <main id="viewport" class="h-screen pt-24 pb-32 px-4 overflow-y-auto overflow-x-hidden">
        <!-- SPA Views -->
    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-8 inset-x-6 h-20 glass rounded-[2.5rem] flex items-center justify-around z-[110] shadow-2xl px-2">
        <button onclick="router('lobby')" id="nav-lobby" class="w-14 h-14 flex items-center justify-center rounded-2xl transition-all duration-300 opacity-40">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        </button>
        <button onclick="router('create')" id="nav-create" class="w-16 h-16 bg-blue-600 rounded-3xl flex items-center justify-center shadow-[0_0_20px_rgba(37,99,235,0.4)] active:scale-90 transition-all border-t border-white/30 -translate-y-4">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
        </button>
        <button onclick="router('profile')" id="nav-profile" class="w-14 h-14 flex items-center justify-center rounded-2xl transition-all duration-300 opacity-40">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </button>
    </nav>

    <!-- Global Components -->
    <div id="toast" class="fixed glass px-6 py-4 rounded-3xl z-[200] flex items-center gap-4 min-w-[280px] shadow-2xl border-white/20">
        <div id="toast-icon-bg" class="w-10 h-10 rounded-xl bg-blue-500/20 flex items-center justify-center text-blue-400">
            <span id="toast-icon">♠️</span>
        </div>
        <div>
            <div id="toast-msg" class="text-sm font-bold">Система готова</div>
            <div id="toast-sub" class="text-[10px] opacity-50 uppercase tracking-widest font-mono">Status: OK</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        
        // --- REACTIVE STATE ---
        const state = {
            user: tg.initDataUnsafe?.user || { first_name: "Dev Player", id: 0 },
            account: {
                balance: 1000,
                wins: 0,
                losses: 0,
                games: 0,
                lastUpdate: Date.now()
            },
            peer: null,
            conn: null,
            myId: null,
            role: null,
            gameState: {
                deck: [], hand: [], opponentHandCount: 0, table: [], trump: null, turn: null
            }
        };

        // --- DATABASE SYNC LAYER (TG CLOUD STORAGE) ---
        async function syncCloud(action = 'load', data = null) {
            return new Promise((resolve) => {
                if (action === 'save') {
                    tg.CloudStorage.setItem('metro_durak_account', JSON.stringify(data), (err, success) => {
                        if (success) console.log("Cloud Saved");
                        resolve(success);
                    });
                } else {
                    tg.CloudStorage.getItem('metro_durak_account', (err, value) => {
                        if (value) {
                            state.account = JSON.parse(value);
                            updateGlobalUI();
                        } else {
                            // First time login - save initial state
                            syncCloud('save', state.account);
                        }
                        resolve(state.account);
                    });
                }
            });
        }

        function updateGlobalUI() {
            document.getElementById('u-balance').innerText = state.account.balance.toLocaleString();
            document.getElementById('u-name').innerText = state.user.first_name;
            if (tg.initDataUnsafe?.user?.photo_url) {
                const avatar = document.getElementById('u-avatar');
                avatar.src = tg.initDataUnsafe.user.photo_url;
                avatar.classList.remove('hidden');
                document.getElementById('u-initial').classList.add('hidden');
            } else {
                document.getElementById('u-initial').innerText = state.user.first_name[0].toUpperCase();
            }
        }

        async function updateBalance(amount) {
            state.account.balance += amount;
            await syncCloud('save', state.account);
            updateGlobalUI();
            tg.HapticFeedback.notificationOccurred(amount > 0 ? 'success' : 'warning');
        }

        // --- NETWORKING (PEERJS) ---
        function initPeer() {
            state.peer = new Peer();
            state.peer.on('open', (id) => {
                state.myId = id;
                document.getElementById('u-status').innerText = `ID: ${id.slice(0, 6)}...`;
                document.getElementById('u-online-indicator').classList.replace('bg-slate-500', 'bg-green-500');
                notify("Узел синхронизирован", "📡", "Cloud & P2P Active");
            });

            state.peer.on('connection', (conn) => {
                state.conn = conn;
                state.role = 'host';
                setupConnectionListeners();
                router('game');
            });
        }

        function setupConnectionListeners() {
            state.conn.on('open', () => {
                notify("Связь установлена", "🔗", "Peer Connected");
                if (state.role === 'host') startGameLogic();
            });
            state.conn.on('data', (data) => {
                if (data.type === 'GAME_INIT') {
                    state.gameState = data.payload;
                    renderGame();
                }
            });
        }

        // --- VIEWS ---
        const views = {
            lobby: () => `
                <div class="space-y-6 animate-in fade-in duration-500">
                    <div class="flex items-center justify-between px-2">
                        <h2 class="text-3xl font-black italic tracking-tighter text-blue-500">СТОЛЫ</h2>
                        <div class="px-3 py-1 bg-white/5 rounded-full text-[10px] font-mono opacity-50 shimmer">LIVE SYNCING</div>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="glass p-6 rounded-[2.5rem] flex justify-between items-center border border-white/5 relative overflow-hidden group">
                            <div class="absolute inset-0 bg-blue-600/5 translate-x-[-100%] group-hover:translate-x-0 transition-transform duration-500"></div>
                            <div class="relative z-10">
                                <p class="text-sm font-bold uppercase tracking-widest">Metro Duel</p>
                                <div class="flex gap-2 mt-1">
                                    <span class="text-[10px] font-mono text-blue-400">CLASSIC</span>
                                    <span class="text-[10px] font-mono text-white/30">•</span>
                                    <span class="text-[10px] font-mono text-emerald-400">BET: 100 💰</span>
                                </div>
                            </div>
                            <button onclick="openJoinModal()" class="relative z-10 bg-blue-600 px-8 py-3 rounded-2xl text-[10px] font-black uppercase tracking-widest shadow-xl shadow-blue-900/20 active:scale-95 transition-all">Играть</button>
                        </div>
                        
                        <div class="glass p-6 rounded-[2.5rem] flex justify-between items-center opacity-40">
                            <div>
                                <p class="text-sm font-bold uppercase tracking-widest italic">Underground VIP</p>
                                <p class="text-[10px] font-mono">BET: 10,000 💰</p>
                            </div>
                            <span class="text-[10px] font-bold uppercase opacity-50 tracking-tighter">Locked</span>
                        </div>
                    </div>
                </div>
            `,
            create: () => `
                <div class="space-y-8 pt-4 animate-in slide-in-from-bottom-10">
                    <div class="text-center">
                        <h2 class="text-4xl font-black italic tracking-tighter uppercase mb-1">Создать Игру</h2>
                        <p class="text-[10px] font-mono opacity-40">SYNCED AS: ${state.user.id}</p>
                    </div>
                    
                    <div class="glass p-8 rounded-[3rem] space-y-8 shadow-2xl relative">
                        <div class="space-y-3">
                            <label class="text-[10px] font-bold uppercase tracking-widest opacity-40 ml-4">Ставка</label>
                            <div class="grid grid-cols-3 gap-2">
                                ${[100, 500, 1000].map(val => `
                                    <button onclick="selectBet(${val})" class="py-4 rounded-2xl border border-white/5 bg-white/5 font-mono text-xs hover:bg-blue-600/20 transition-colors">${val}</button>
                                `).join('')}
                            </div>
                            <input id="custom-bet" type="number" placeholder="Своя ставка..." class="w-full bg-black/40 p-5 rounded-2xl font-mono text-center border border-white/10 outline-none focus:border-blue-500 transition-all">
                        </div>

                        <div class="p-6 bg-blue-600/10 rounded-3xl border border-blue-500/20">
                            <p class="text-[10px] text-center opacity-60 font-medium">Ваш ID для приглашения:</p>
                            <p class="text-xl font-mono font-bold text-center text-blue-400 mt-1 select-all">${state.myId || 'Генерация...'}</p>
                        </div>

                        <button onclick="copyMyId()" class="w-full py-6 bg-blue-600 rounded-[2rem] text-sm font-black uppercase tracking-widest shadow-2xl active:scale-95 transition-all">Копировать ID и ждать</button>
                    </div>
                </div>
            `,
            profile: () => {
                const wr = state.account.games > 0 ? Math.round((state.account.wins / state.account.games) * 100) : 0;
                return `
                <div class="pt-8 space-y-8 animate-in zoom-in-95 duration-500">
                    <div class="flex flex-col items-center gap-6">
                        <div class="relative">
                            <div class="w-36 h-36 rounded-[3.5rem] bg-gradient-to-br from-blue-600 to-indigo-900 p-1 shadow-[0_0_50px_rgba(37,99,235,0.3)] rotate-3 hover:rotate-0 transition-transform duration-500">
                                <img src="https://api.dicebear.com/7.x/pixel-art/svg?seed=${state.user.id}" class="w-full h-full rounded-[3.3rem] bg-[#030712] p-2 object-cover">
                            </div>
                            <div class="absolute -bottom-2 -right-2 bg-blue-600 px-4 py-1 rounded-full text-[10px] font-black italic shadow-xl">LVL ${Math.floor(state.account.wins / 5) + 1}</div>
                        </div>
                        <div class="text-center">
                            <h2 class="text-4xl font-black italic tracking-tighter uppercase">${state.user.first_name}</h2>
                            <p class="text-blue-400 font-mono text-[10px] tracking-[0.3em] uppercase mt-1 opacity-80">Cloud Authenticated</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div class="glass p-6 rounded-[2.5rem] text-center">
                            <p class="text-[10px] font-bold opacity-40 uppercase mb-1">P2P Wins</p>
                            <p class="text-3xl font-mono font-black italic text-emerald-400">${state.account.wins}</p>
                        </div>
                        <div class="glass p-6 rounded-[2.5rem] text-center">
                            <p class="text-[10px] font-bold opacity-40 uppercase mb-1">Win Rate</p>
                            <p class="text-3xl font-mono font-black italic text-blue-400">${wr}%</p>
                        </div>
                    </div>

                    <div class="glass p-8 rounded-[3rem] space-y-4">
                        <div class="flex justify-between items-center text-sm">
                            <span class="opacity-40 font-bold uppercase text-[10px]">Total Games Played</span>
                            <span class="font-mono font-bold">${state.account.games}</span>
                        </div>
                        <div class="w-full bg-white/5 h-2 rounded-full overflow-hidden">
                            <div class="bg-blue-600 h-full" style="width: ${wr}%"></div>
                        </div>
                        <div class="flex justify-between items-center text-[10px] font-bold">
                            <span class="text-emerald-500 uppercase">${state.account.wins} WINS</span>
                            <span class="text-red-500 uppercase">${state.account.losses} LOSSES</span>
                        </div>
                    </div>

                    <button onclick="syncCloud('load')" class="w-full py-4 text-[10px] font-black uppercase tracking-widest opacity-30 hover:opacity-100 transition-opacity">Force Cloud Resync</button>
                </div>
            `},
            game: () => `
                <div class="fixed inset-0 z-[150] playing-table flex flex-col p-4 animate-in zoom-in-95 overflow-hidden">
                    <div class="flex justify-between items-center text-white/40 font-mono text-[8px] uppercase pt-2">
                        <span>Encrypted Peer: ${state.conn?.peer.slice(0,10)}</span>
                        <div class="flex items-center gap-2">
                             <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                             <span>Live Data Sync</span>
                        </div>
                    </div>
                    <div class="flex-1 flex items-center justify-center">
                        <p class="text-[10px] font-bold opacity-20 uppercase tracking-[0.5em] animate-pulse">Waiting for network handshake...</p>
                    </div>
                    <div class="mb-20">
                         <button onclick="router('lobby')" class="w-full py-4 glass rounded-2xl text-[10px] font-black uppercase text-red-500 border-red-500/20">Emergency Quit</button>
                    </div>
                </div>
            `
        };

        // --- CORE FUNCTIONS ---
        function router(view) {
            const vp = document.getElementById('viewport');
            vp.innerHTML = views[view]();
            
            document.querySelectorAll('nav button').forEach(b => b.classList.add('opacity-40'));
            const activeBtn = document.getElementById(`nav-${view}`);
            if (activeBtn) activeBtn.classList.remove('opacity-40');
            
            tg.HapticFeedback.impactOccurred('medium');
        }

        function notify(msg, icon, sub = "METRO NETWORK") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-sub').innerText = sub;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.add('active');
            setTimeout(() => toast.classList.remove('active'), 3000);
        }

        function copyMyId() {
            if (!state.myId) return;
            navigator.clipboard.writeText(state.myId);
            tg.HapticFeedback.notificationOccurred('success');
            notify("ID скопирован", "📋", "Отправьте его оппоненту");
        }

        function selectBet(val) {
            document.getElementById('custom-bet').value = val;
            tg.HapticFeedback.selectionChanged();
        }

        // --- INITIALIZATION ---
        window.onload = async () => {
            tg.expand();
            tg.ready();
            
            // 1. Sync data from Cloud
            document.getElementById('u-status').innerText = "Fetching Cloud Data...";
            await syncCloud('load');
            
            // 2. Init Network
            initPeer();
            
            // 3. Render Initial View
            router('lobby');
        };
    </script>
</body>
</html>
